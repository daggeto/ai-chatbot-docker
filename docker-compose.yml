version: '3.8'

services:
  ai-chatbot-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/models/mistral-7b-instruct-v0.1.Q4_K_M.gguf
      - DOCS_PATH=/app/docs
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - MAX_TOKENS=512
      - TEMPERATURE=0.7
    volumes:
      - ./backend/models:/models
      - ./backend/docs:/app/docs
      - chroma_data:/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - ai-chatbot-api
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local

networks:
  default:
    driver: bridge
